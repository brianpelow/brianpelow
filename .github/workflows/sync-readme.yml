name: sync-readme

on:
  schedule:
    - cron: "45 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Splice generated regions
        run: python scripts/splice_readme.py

      - name: Guard against broken tables
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path("README.md").read_text(encoding="utf-8").split("\n")
          glued = [i + 1 for i, l in enumerate(lines) if l.startswith("|") and i and lines[i - 1] and not lines[i - 1].startswith("|")]
          if glued:
              raise SystemExit(f"table glued to the line above at: {glued}")
          print("no broken tables")
          PY

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(catalog): refresh generated catalog from nightly state"
          git push
